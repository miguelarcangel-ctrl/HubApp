<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DP World Panamá — Portal de Aplicaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1A1060;
    --navy-deep: #0e0940;
    --indigo: #3E3C90;
    --indigo-lt: #6D6AD0;
    --green: #00C389;
    --amber: #F5A623;
    --white: #ffffff;
    --muted: #6b7199;
    --line: #DAD8EE;
  }
  html, body {
    min-height: 100%;
    font-family: 'Barlow', sans-serif;
    background: var(--white);
    color: var(--navy-deep);
    overflow-x: hidden;
  }
  /* Fondo blanco con grid verde */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: #ffffff;
  }
  .bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,195,137,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,195,137,0.15) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  /* vignette central para que el centro quede limpio */
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 85% 75% at 50% 40%, rgba(255,255,255,0.92) 0%, transparent 100%);
  }
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 24px 80px;
  }
  /* Header */
  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.9s cubic-bezier(0.16,1,0.3,1) both;
  }
  .logo-wrap { margin-bottom: 24px; }
  /* Logo color sobre fondo blanco — sin filtro */
  .logo-wrap img { height: 92px; width: auto; display: block; }
  .eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 12px;
  }
  .header-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(38px, 8vw, 68px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.5px;
    color: var(--navy);
    margin-bottom: 16px;
  }
  .header-divider {
    width: 40px;
    height: 3px;
    background: var(--green);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .header-sub {
    font-size: 14px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.3px;
  }

  /* Hub: red de apps + tarjeta de detalle */
  .hub {
    width: 100%;
    max-width: 1080px;
    display: grid;
    grid-template-columns: minmax(0,1fr);
    gap: 20px;
    align-items: center;
    animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.15s both;
  }
  @media (min-width: 960px) { .hub { grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); } }
  .hub-svg svg { display: block; width: 100%; height: auto; max-width: 600px; margin: 0 auto; overflow: visible; }
  .app { cursor: pointer; }
  .app:focus { outline: none; }
  .app .disc { fill: #fff; transition: fill .25s; }
  .app .ab { fill: var(--navy); transition: fill .25s; }
  .app:hover .disc { fill: #F1F0FB; }
  .app.on .disc { fill: var(--navy); }
  .app.on .ab { fill: #fff; }
  .app.on .ring, .app:focus-visible .ring { stroke: var(--green); stroke-width: 3.5; stroke-dasharray: none; }
  .app.main .disc { fill: var(--navy); }
  .app.main .ab { fill: #fff; }
  .app .lbl { fill: var(--navy); stroke: #fff; stroke-width: 6px; stroke-linejoin: round; paint-order: stroke; }
  .spoke { stroke: var(--line); stroke-width: 2; }
  .spoke.dev { stroke-dasharray: 5 6; }
  .pulse { fill: var(--green); }

  .hub-card {
    position: relative;
    background: var(--navy);
    border-radius: 18px;
    padding: 32px 30px 28px;
    color: #fff;
    min-width: 0;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(14,9,64,0.18);
  }
  /* mini grid interna */
  .hub-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
  }
  .hub-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--green), var(--indigo-lt));
  }
  .hub-card > * { position: relative; }
  .st {
    display: inline-block;
    font: 700 11px 'Barlow', sans-serif;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 4px;
    margin-bottom: 14px;
  }
  .st.ok { background: rgba(0,195,137,.16); color: var(--green); }
  .st.dev { background: rgba(245,166,35,.16); color: var(--amber); }
  .card-tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-bottom: 6px;
  }
  .hub-card h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(28px, 4vw, 36px);
    font-weight: 800;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: .02em;
  }
  .hub-card p.d { margin-top: 12px; font-size: 15px; line-height: 1.55; color: rgba(255,255,255,0.72); }
  .hub-card ul { margin-top: 16px; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .hub-card li { display: flex; gap: 10px; font-size: 14.5px; line-height: 1.45; color: rgba(255,255,255,0.72); }
  .hub-card li::before {
    content: '';
    flex: none;
    width: 6px; height: 6px;
    margin-top: 8px;
    border-radius: 50%;
    background: var(--green);
  }
  .actions { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 11px 18px;
    border-radius: 999px;
    font: 600 13px 'Barlow', sans-serif;
    letter-spacing: .06em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background .2s, transform .2s, border-color .2s;
  }
  .btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.pri { background: var(--green); color: #08201A; }
  .btn.pri:hover { transform: translateX(3px); }
  .btn.sec { border: 1px solid rgba(255,255,255,0.22); color: #fff; }
  .btn.sec:hover { border-color: var(--green); }
  .soon { font-size: 13px; color: rgba(255,255,255,0.5); }
  .note { margin-top: 18px; font-size: 12.5px; color: rgba(255,255,255,0.45); }
  .hint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* Acceso directo */
  .quick {
    width: 100%;
    max-width: 1080px;
    margin-top: 56px;
    animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.3s both;
  }
  .quick-head {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--navy);
    margin: 0 0 14px;
  }
  .quick-head::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .qa {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--navy);
    border-radius: 14px;
    color: #fff;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.06);
    transition: transform .3s cubic-bezier(0.16,1,0.3,1), box-shadow .3s;
    min-width: 0;
  }
  a.qa:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(14,9,64,0.22); }
  .qa.off { opacity: .55; }
  .qa .ico {
    flex: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font: 800 14px 'Barlow Condensed', sans-serif;
    letter-spacing: 1px;
    border: 2px solid var(--indigo-lt);
  }
  .qa.dev .ico { border-color: var(--amber); border-style: dashed; }
  .qa b { display: block; font: 700 18px/1.1 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: .03em; }
  .qa small { display: block; font-size: 12.5px; color: rgba(255,255,255,0.55); margin-top: 2px; }
  .qa .arr { margin-left: auto; color: var(--green); flex: none; }
  .qa .arr svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; display: block; }

  :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

  /* Footer */
  .footer {
    margin-top: 40px;
    text-align: center;
    animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.5s both;
  }
  .footer-text { font-size: 11.5px; color: rgba(107,113,153,0.7); letter-spacing: 0.5px; }
  .sep { display: inline-block; margin: 0 8px; opacity: 0.5; }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-22px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(26px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 600px) {
    .page { padding: 40px 16px 60px; }
    .header { margin-bottom: 20px; }
    .logo-wrap img { height: 76px; }
    .hub-card { padding: 26px 20px 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="page">
  <header class="header">
    <div class="logo-wrap">
      <img
        src="https://raw.githubusercontent.com/miguelarcangel-ctrl/cotizador-dpworld/main/logo_white.png"
        alt="DP World Panamá"
      >
    </div>
    <p class="eyebrow">DAL · Colón Logistics Park</p>
    <h1 class="header-title">Portal de<br>Aplicaciones</h1>
    <div class="header-divider"></div>
    <p class="header-sub">Operación 3PL — Uso interno</p>
  </header>

  <section class="hub" aria-label="Hub de aplicaciones">
    <div class="hub-svg">
      <svg viewBox="0 0 520 470" id="hubSvg" role="group" aria-label="Hub y aplicaciones"></svg>
      <p class="hint">Toca cada app para ver qué hace y abrirla.</p>
    </div>
    <div class="hub-card" id="hubCard" aria-live="polite"></div>
  </section>

  <section class="quick" aria-label="Acceso directo">
    <h2 class="quick-head">En operación</h2>
    <div class="quick-grid" id="qOk"></div>
    <h2 class="quick-head">Prototipos y en desarrollo</h2>
    <div class="quick-grid" id="qDev"></div>
  </section>

  <footer class="footer">
    <p class="footer-text">DP World Panamá<span class="sep">·</span>DAL Colón Logistics Park<span class="sep">·</span>Uso interno</p>
  </footer>
</div>

<script>
/* Cada app: s = "ok" (en operación) o "dev" (prototipo / en desarrollo). links[0] es el principal. */
var APPS = [
  {id: "hub", n: "Hub", s: "ok", st: "En operación", tag: "Plataforma digital",
   d: "La puerta de entrada a toda la plataforma. Acceso directo a cada app, sin recordar direcciones.",
   b: ["Un solo lugar para todo el equipo", "Funciona en PC, tableta y celular", "Base para el login único de la versión 2"]},
  {n: "Cotizador 3PL", lbl: "Cotizador", ab: "COT", s: "ok", st: "En operación", tag: "Ventas",
   d: "Propuestas comerciales 3PL en minutos, con tarifas, CAPEX/OPEX y documento de entrega operativa.",
   b: ["Cotización completa en menos de 5 minutos", "Margen con semáforo y benchmark de mercado", "PDF para el cliente y ficha interna"],
   links: [["Abrir app", "https://cotizador-dpworld-i7d3.vercel.app/"]]},
  {n: "Control de Horas", lbl: "Horas", ab: "HRS", s: "ok", st: "En operación", tag: "Operaciones",
   d: "El turno completo en digital, del toolbox al cierre.",
   b: ["Tareas con cronómetro y eficiencia en tiempo real", "Rutinas con QR en puntos de control", "Costo productivo contra costo perdido", "Pantalla TV para el piso de operación"],
   links: [["Abrir app", "https://control-horas-dpworld.vercel.app/"], ["Pantalla TV", "https://control-horas-dpworld.vercel.app/dashboard.html"]]},
  {n: "Control de Rampas", lbl: "Rampas", ab: "RMP", s: "ok", st: "En operación", tag: "Calidad · BASC",
   d: "Inspección de contenedores BASC SL-02-007 con fotos y resultado automático, hoy convertida en Control de Rampas: el contenedor de la rampa al puerto.",
   b: ["17 ítems con foto por ítem", "APTO o NO APTO al instante", "PDF listo para auditoría", "Seguimiento de rampas y vista para el cliente"],
   links: [["Abrir app", "https://inspeccion-contenedores-dpworld.vercel.app/"]]},
  {n: "Last Mile", lbl: "Last Mile", ab: "LM", s: "dev", st: "Prototipo", tag: "Transporte",
   d: "Coordinación de bookings y transporte de contenedores con los transportistas, del retiro de vacío a la entrega en terminal.",
   b: ["Bookings y asignación de transporte", "Visibilidad para el equipo y el cliente", "Se unirá con Control de Rampas"],
   links: [["Abrir prototipo", "https://inspeccion-contenedores-dpworld.vercel.app/last-mile/prototype/"]]},
  {n: "Alertas de Calidad", lbl: "Alertas", ab: "CAL", s: "ok", st: "En operación", tag: "Calidad · Bodega",
   d: "Alertas de calidad estandarizadas y descargables, con la marca DP World.",
   b: ["Formato único para toda la operación", "PDF listo para compartir", "Trazabilidad de cada incidencia"],
   links: [["Abrir app", "https://alertas-calidad-app.vercel.app/"]]},
  {n: "Reportería BI", lbl: "BI", ab: "BI", s: "dev", st: "En construcción", tag: "Inteligencia operativa",
   d: "Tableros de Power BI e indicadores alimentados desde P4.",
   b: ["KPIs de operación en un solo tablero", "Reportería automática", "Base de la inteligencia operativa del año 2"]}
];

var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var svg = document.getElementById("hubSvg"), NS = "http://www.w3.org/2000/svg", cx = 260, cy = 228, R0 = 168;
var ARROW = '<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
function el(t, a, p) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); (p || svg).appendChild(e); return e; }

var sats = APPS.slice(1);
sats.forEach(function (a, i) {
  var ang = -Math.PI / 2 + i * 2 * Math.PI / sats.length;
  a.x = cx + R0 * Math.cos(ang); a.y = cy + R0 * Math.sin(ang);
  el("line", {x1: cx, y1: cy, x2: a.x, y2: a.y, "class": "spoke" + (a.s === "dev" ? " dev" : "")});
  if (!reduce) {
    var c = el("circle", {r: 4, "class": "pulse"});
    el("animateMotion", {dur: (2.4 + i * .3) + "s", repeatCount: "indefinite", path: "M" + cx + " " + cy + " L" + a.x + " " + a.y}, c);
  }
});

function node(a, x, y, r, main) {
  var g = el("g", {"class": "app" + (main ? " main" : ""), tabindex: "0", role: "button", "aria-label": a.n});
  el("circle", {cx: x, cy: y, r: r, "class": "disc"}, g);
  el("circle", {cx: x, cy: y, r: r, "class": "ring", fill: "none",
    stroke: main ? "#00C389" : (a.s === "ok" ? "#3E3C90" : "#F5A623"),
    "stroke-width": main ? 3 : 2.5, "stroke-dasharray": a.s === "ok" ? "" : "5 5"}, g);
  var t = el("text", {x: x, y: y + (main ? 10 : 6), "text-anchor": "middle", "class": "ab",
    "font-family": "Barlow Condensed,Arial", "font-weight": "800", "font-size": main ? 30 : 18, "letter-spacing": "1"}, g);
  t.textContent = main ? "HUB" : a.ab;
  if (!main) {
    var l = el("text", {x: x, y: y + r + 19, "text-anchor": "middle", "class": "lbl",
      "font-family": "Barlow,Arial", "font-weight": "600", "font-size": "16"}, g);
    l.textContent = a.lbl;
  }
  function s() { hubSel(a); }
  g.addEventListener("click", s);
  g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); s(); } });
  a.g = g;
}
sats.forEach(function (a) { node(a, a.x, a.y, 34, false); });
node(APPS[0], cx, cy, 58, true);

function hubSel(a) {
  sats.forEach(function (x) { x.g.classList.toggle("on", x === a); });
  var acts = "";
  if (a.links) {
    acts = '<div class="actions">' + a.links.map(function (l, i) {
      return '<a class="btn ' + (i ? "sec" : "pri") + '" href="' + esc(l[1]) + '" target="_blank" rel="noopener">' + esc(l[0]) + (i ? "" : ARROW) + '</a>';
    }).join("") + '</div>';
  } else if (a.id !== "hub") {
    acts = '<div class="actions"><span class="soon">Disponible pronto.</span></div>';
  }
  document.getElementById("hubCard").innerHTML =
    '<span class="st ' + a.s + '">' + esc(a.st) + '</span>' +
    '<p class="card-tag">' + esc(a.tag) + '</p>' +
    '<h2>' + esc(a.n) + '</h2>' +
    '<p class="d">' + esc(a.d) + '</p>' +
    '<ul>' + a.b.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>' + acts +
    (a.id === "hub" ? '<p class="note">Línea continua: en operación. Línea punteada: prototipo o en desarrollo.</p>' : "");
}
hubSel(APPS[0]);

/* Acceso directo: una fila por app, agrupadas por estado */
sats.forEach(function (a) {
  var link = a.links && a.links[0];
  var q = document.createElement(link ? "a" : "div");
  q.className = "qa " + a.s + (link ? "" : " off");
  if (link) { q.href = link[1]; q.target = "_blank"; q.rel = "noopener"; }
  q.innerHTML = '<span class="ico">' + esc(a.ab) + '</span><span><b>' + esc(a.n) + '</b><small>' + esc(a.st) + ' · ' + esc(a.tag) + '</small></span>' +
    (link ? '<span class="arr">' + ARROW + '</span>' : '');
  document.getElementById(a.s === "ok" ? "qOk" : "qDev").appendChild(q);
});
</script>
</body>
</html>
